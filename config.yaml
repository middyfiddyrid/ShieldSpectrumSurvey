app:
  host: 127.0.0.1
  port: 8765
  open_browser: true
branding:
  company: Shield Security Systems
  logo_path: 'C:\Users\Union Terminal\Desktop\Shield_TSCM_Business\branding\shield_security_logo.png'
  operator: ''
radius:
  broadcast_miles: 25
  land_mobile_miles: 5
api_keys:
  opencellid: ''
  radioreference_user: ''
  radioreference_pass: ''
  # Anthropic key enables AI signal descriptions in the wiki (numeric signal
  # profile only is sent — never client, address, or room data)
  anthropic: ''
uls:
  extract_dir: ''
  stale_days: 30
detection:
  threshold_db: 12.0
  merge_gap_bins: 2
  min_persistence: 0.05
  interior_delta_flag_db: 10.0
  room_delta_flag_db: 12.0
  ignore_below_mhz: 0.15        # drop analyzer LF artifacts below this
  lf_extra_threshold_db: 6.0    # extra SNR required below lf_extra_below_mhz
  lf_extra_below_mhz: 50.0
capture:                        # signal-wiki zoom fingerprints
  avg_passes: 20
  maxhold_dwell_s: 12.0
sweep:
  sweep_points: 112
  seconds_per_sweep: 0.36
  segment_width_mhz:
    subghz: 75
    mid: 100
    high: 200
  profiles:
    quick:
      minutes: 15
      avg_passes: 5
      span_scale: 2.0
    standard:
      minutes: 45
      avg_passes: 10
      span_scale: 1.0
    deep:
      minutes: 120
      avg_passes: 20
      span_scale: 0.5
  band_dwell_weights:
    ism_433: 3.0
    ism_915: 3.0
    ism_2400: 3.0
    dect: 2.5
    cellular_uplink: 2.5
    ism_5800: 2.0
    gps: 1.5
    default: 1.0
    broadcast: 0.4
cellmapper:
  import_path: data/cellmapper_towers.json
integrations:
  # Discord webhook URL for the TSCM community channel. The "ASK COMMUNITY"
  # button posts a SANITIZED anomaly list (frequencies/characteristics only —
  # never the address, client, operator, or rooms). Posting is always
  # operator-confirmed with a preview first.
  discord_webhook: ''
device:
  simulate: false
  port: ''
  baud: 500000
cache:
  dir: cache
  max_age_hours: 720
calibration:
  test_freq_mhz: 433.92
  winner: &id001
    strategy: maxhold_20s
    span_mhz: 50.0
    detection_rate: 0.0
    mean_snr_db: null
    time_cost_s: 0.7
  results:
  - strategy: normal_raw_x10
    span_mhz: 50.0
    detection_rate: 0.0
    mean_snr_db: null
    time_cost_s: 3.6
  - strategy: average_x10
    span_mhz: 50.0
    detection_rate: 0.0
    mean_snr_db: null
    time_cost_s: 3.6
  - strategy: average_x28
    span_mhz: 50.0
    detection_rate: 0.0
    mean_snr_db: null
    time_cost_s: 9.7
  - strategy: max_x28
    span_mhz: 50.0
    detection_rate: 0.0
    mean_snr_db: null
    time_cost_s: 11.8
  - strategy: maxhold_10s
    span_mhz: 50.0
    detection_rate: 0.0
    mean_snr_db: null
    time_cost_s: 10.2
  - *id001
  calibrated_unit: WSUB1G_PLUS+6G_PLUS
  calibrated_at: 2026-06-10 06:54
